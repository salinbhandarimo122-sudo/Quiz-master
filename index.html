<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Quiz Master</title> <style> * { box-sizing: border-box; margin: 0; padding: 0; } body { font-family: Arial, sans-serif; background: #f2f6ff; min-height: 100vh; display: flex; justify-content: center; align-items: center; } .container { width: 95%; max-width: 450px; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.12); text-align: center; } h1 { font-size: 32px; margin-bottom: 10px; } .subtitle { color: #666; margin-bottom: 25px; } .subject-btn { width: 100%; padding: 18px; margin: 10px 0; border: none; border-radius: 12px; font-size: 20px; font-weight: bold; cursor: pointer; background: #2878ff; color: white; } .subject-btn:active { transform: scale(0.98); } .quiz { display: none; } .question { font-size: 21px; font-weight: bold; margin: 20px 0; } .option { width: 100%; padding: 14px; margin: 8px 0; border: 2px solid #ddd; border-radius: 10px; background: white; font-size: 17px; cursor: pointer; } .option:hover { background: #eef4ff; } #nextBtn { width: 100%; padding: 14px; margin-top: 15px; border: none; border-radius: 10px; background: #222; color: white; font-size: 17px; cursor: pointer; } #result { display: none; } .score { font-size: 30px; font-weight: bold; margin: 20px; } .restart { padding: 14px 25px; border: none; border-radius: 10px; background: #2878ff; color: white; font-size: 17px; } </style> </head> <body> <div class="container"> <!-- HOME --> <div id="home"> <h1>📚 Quiz Master</h1> <p class="subtitle">Test your knowledge!</p> <button class="subject-btn" onclick="startScience()"> 🔬 SCIENCE </button> <button class="subject-btn"> 📖 ENGLISH </button> <button class="subject-btn"> 🌍 SOCIAL </button> </div> <!-- QUIZ --> <div class="quiz" id="quiz"> <h1>🔬 Science Quiz</h1> <p id="questionNumber"></p> <div class="question" id="question"></div> <div id="options"></div> <button id="nextBtn" onclick="nextQuestion()"> Next </button> </div> <!-- RESULT --> <div id="result"> <h1>🎉 Quiz Complete!</h1> <p class="score" id="score"></p> <button class="restart" onclick="restartQuiz()"> Try Again </button> </div> </div> <script> const questions = [ { question: "What is the chemical formula of water?", options: ["CO₂", "H₂O", "O₂", "NaCl"], answer: 1 }, { question: "Which planet is known as the Red Planet?", options: ["Earth", "Venus", "Mars", "Jupiter"], answer: 2 }, { question: "What gas do humans need for respiration?", options: ["Carbon dioxide", "Oxygen", "Nitrogen", "Hydrogen"], answer: 1 }, { question: "How many bones are there in an adult human body?", options: ["206", "201", "210", "196"], answer: 0 }, { question: "What is the largest organ of the human body?", options: ["Heart", "Brain", "Skin", "Liver"], answer: 2 } ]; let currentQuestion = 0; let score = 0; let selected = false; function startScience() { document.getElementById("home").style.display = "none"; document.getElementById("quiz").style.display = "block"; currentQuestion = 0; score = 0; showQuestion(); } function showQuestion() { selected = false; const q = questions[currentQuestion]; document.getElementById("questionNumber").innerText = "Question " + (currentQuestion + 1) + " of " + questions.length; document.getElementById("question").innerText = q.question; const optionsDiv = document.getElementById("options"); optionsDiv.innerHTML = ""; q.options.forEach((option, index) => { const button = document.createElement("button"); button.className = "option"; button.innerText = option; button.onclick = function() { if (selected) return; selected = true; if (index === q.answer) { score++; button.style.background = "#b7f7c1"; } else { button.style.background = "#ffb8b8"; } }; optionsDiv.appendChild(button); }); } function nextQuestion() { if (!selected) { alert("Please select an answer!"); return; } currentQuestion++; if (currentQuestion < questions.length) { showQuestion(); } else { document.getElementById("quiz").style.display = "none"; document.getElementById("result").style.display = "block"; document.getElementById("score").innerText = "Your Score: " + score + " / " + questions.length; } } function restartQuiz() { document.getElementById("result").style.display = "none"; document.getElementById("home").style.display = "block"; } </script> </body> </html>
